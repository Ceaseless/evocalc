<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evo Calculator (Rain)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

  <div class="container">
    <h2>Evo Calculator (Rain)</h2>
    <div class="control-group">

      <label>BC Discount:</label>
      <select id="bcDiscount" onchange="calculatePoints()">
        <option value="0">None</option>
        <option value="0.1">Bronze 10%</option>
        <option value="0.2">Silver 20%</option>
        <option value="0.4">Gold 40%</option>
      </select>

      <label>Current tier:</label>
      <div class="inline">
        <select id="startTier" onchange="calculatePoints()">
          <option value="0" selected>HR1</option>
          <option value="1">HR100</option>
          <option value="2">G Rank</option>
          <option value="3">Extreme</option>
        </select>

        <label>at level</label>
        <input type="number" id="startLevel" min="1" max="100" value="1" oninput="calculatePoints()">
      </div>

      <label>Target tier:</label>
      <div class="inline">
        <select id="endTier" onchange="calculatePoints()">
          <option value="0">HR1</option>
          <option value="1">HR100</option>
          <option value="2">G Rank</option>
          <option value="3" selected>Extreme</option>
        </select>

        <label>at level</label>
        <input type="number" id="endLevel" min="1" max="100" value="100" oninput="calculatePoints()">
      </div>

      <div class="checkbox-row">
         <label>Is Premium</label>
         <input type="checkbox" id="isPremium" onchange="calculatePoints()">
      </div>

    </div>
    <div class="output-group" id="cost-output">
      <label>g Points needed: </label>
      <output class="val" data-key="gPoints">0</output>

      <label>Gg Points needed: </label>
      <output class="val" data-key="ggPoints">0</output>

      <label>DPG needed: </label>
      <output class="val" data-key="dpg">0</output>

      <label>DPG stacks needed: </label>
      <output class="val" data-key="stacks">0</output>

      <label>RdP cost: </label>
      <output class="val" data-key="rdp">0</output>

      <label>BC cost: </label>
      <output class="val" data-key="bc">0</output>
    </div>
    <div class="credits">
      <b>Credits/Sources</b><br>
      <a href="http://irisayame.web.fc2.com/mhf/mhf_sinka.html">Pre-Z point table</a> (irisayame)
      <br>
      <a href="https://mh.fist.moe/database/#DBsection20">Layout + Z point table</a> (SirFist)
    </div>
  </div>
  <script src="scripts/calc.js" onload="calculatePoints()"></script>

</body>

</html>
